name: Build C++ Application

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  
jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up MinGW with Choco
      run: |
        choco install mingw -y
        refreshenv
      shell: powershell
    
    - name: Create build directory
      run: mkdir build
      shell: powershell
    
    - name: Build main.cpp
      run: |
        cd build
        g++ -fdiagnostics-color=always -g -static ..\main.cpp -o main.exe
      shell: powershell
    
    - name: Check if executable was created
      run: |
        if (Test-Path build/main.exe) {
          Write-Host "Build successful! main.exe created."
        } else {
          Write-Host "Build failed!"
          exit 1
        }
      shell: powershell
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: main-executable
        path: build/main.exe
        retention-days: 30
    
    - name: Create Release and Upload
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/main.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
